    <script>

        };

            const API_URL = 'https://super.pc28998.com/history/JND28';
            const CORS_PROXIES = [
                { url: 'https://api.allorigins.win/raw?url=' },
                { url: 'https://api.codetabs.com/v1/proxy?quest=' }
            ];
            const STORAGE_KEY = 'xiexiaoyu_jndyc3_pay_v9';
            const MOON_EYE_GROUPS = { '月': [9, 12, 15, 18], '之': [7, 10, 16, 19], '眼': [8, 11, 17, 20] };
            const ALL_SHAPES = ['小单', '小双', '大单', '大双'];

            function getTypeFromSum(sum) {
                let size = sum >= 14 ? '大' : '小';
                let parity = sum % 2 === 0 ? '双' : '单';
                return size + parity;
            }

            // ==================== 确定随机数生成器（替换Math.random） ====================
            function mulberry32(seed) {
                let s = seed | 0;
                return function() {
                    s = (s + 0x6D2B79F5) | 0;
                    let t = Math.imul(s ^ s >>> 15, s | 1);
                    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            function seedFromData(expect, nums, sum) {
                const str = `${expect}_${nums.join('_')}_${sum}`;
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) - hash) + str.charCodeAt(i);
                    hash |= 0;
                }
                return hash;
            }

            // ==================== 引擎一：景天MLP（确定种子版本） ====================
            class MLP {
                constructor(inputSize, hiddenSize, outputSize, randFn) {
                    this.inputSize = inputSize;
                    this.hiddenSize = hiddenSize;
                    this.outputSize = outputSize;
                    this.W1 = Array(inputSize).fill().map(() => Array(hiddenSize).fill().map(() => (randFn() - 0.5) * Math.sqrt(
                        2 / inputSize)));
                    this.b1 = Array(hiddenSize).fill(0);
                    this.W2 = Array(hiddenSize).fill().map(() => Array(outputSize).fill().map(() => (randFn() - 0.5) * Math.sqrt(
                        2 / hiddenSize)));
                    this.b2 = Array(outputSize).fill(0);
                }
                relu(x) { return Math.max(0, x); }
                reluDeriv(x) { return x > 0 ? 1 : 0; }
                softmax(logits) {
                    const max = Math.max(...logits);
                    const exps = logits.map(v => Math.exp(v - max));
                    const sum = exps.reduce((a, b) => a + b, 0);
                    return exps.map(v => v / sum);
                }
                forward(x) {
                    this.z1 = this.b1.map((b, j) => { let s = b; for (let i = 0; i < this.inputSize; i++) s += x[i] * this
                            .W1[i][j]; return s; });
                    this.a1 = this.z1.map(z => this.relu(z));
                    this.z2 = this.b2.map((b, k) => { let s = b; for (let j = 0; j < this.hiddenSize; j++) s += this.a1[j] *
                            this.W2[j][k]; return s; });
                    return this.softmax(this.z2);
                }
                trainOne(x, y, lr) {
                    const p = this.forward(x);
                    const dz2 = p.map((v, i) => v - y[i]);
                    const da1 = Array(this.hiddenSize).fill(0);
                    for (let j = 0; j < this.hiddenSize; j++)
                        for (let k = 0; k < this.outputSize; k++) { this.W2[j][k] -= lr * this.a1[j] * dz2[k];
                            da1[j] += dz2[k] * this.W2[j][k]; }
                    for (let k = 0; k < this.outputSize; k++) this.b2[k] -= lr * dz2[k];
                    const dz1 = da1.map((v, j) => v * (this.z1[j] > 0 ? 1 : 0));
                    for (let i = 0; i < this.inputSize; i++)
                        for (let j = 0; j < this.hiddenSize; j++) this.W1[i][j] -= lr * x[i] * dz1[j];
                    for (let j = 0; j < this.hiddenSize; j++) this.b1[j] -= lr * dz1[j];
                }
                train(X, Y, epochs, lr) { for (let e = 0; e < epochs; e++)
                        for (let i = 0; i < X.length; i++) this.trainOne(X[i], Y[i], lr); }
            }

            function extractFeatures(historyData, lookback = 10) {
                if (historyData.length < lookback) return null;
                const f = [];
                for (let i = 0; i < lookback; i++) { const idx = ALL_SHAPES.indexOf(historyData[i].type); for (let j = 0; j <
                        4; j++) f.push(j === idx ? 1 : 0); }
                for (let i = 0; i < lookback; i++) f.push(historyData[i].sum / 27);
                const stat = { '小单': 0, '小双': 0, '大单': 0, '大双': 0 };
                for (let i = 0; i < Math.min(5, historyData.length); i++) stat[historyData[i].type] += 1;
                for (let s of ALL_SHAPES) f.push(stat[s] / 5);
                return f;
            }

            let mlpModel = null;
            let modelTrained = false;

            function trainMLP(historyData) {
                if (modelTrained || historyData.length < 11) return false;
                const latest = historyData[0];
                const seed = seedFromData(latest.expect, latest.nums, latest.sum);
                const randFn = mulberry32(seed);

                const X = [],
                    Y = [];
                for (let i = 10; i < historyData.length; i++) {
                    const feat = extractFeatures(historyData.slice(i - 10, i), 10);
                    if (!feat) continue;
                    const idx = ALL_SHAPES.indexOf(historyData[i].type);
                    const oh = [0, 0, 0, 0];
                    oh[idx] = 1;
                    X.push(feat);
                    Y.push(oh);
                }
                if (X.length < 20) return false;
                const inputDim = X[0].length;
                mlpModel = new MLP(inputDim, 32, 4, randFn);
                mlpModel.train(X, Y, 100, 0.01);
                modelTrained = true;
                return true;
            }

            function getJingTianThree(historyData) {
                if (!modelTrained || historyData.length < 10) {
                    const freq = {};
                    historyData.forEach(item => freq[item.type] = (freq[item.type] || 0) + 1);
                    return ALL_SHAPES.sort((a, b) => (freq[b] || 0) - (freq[a] || 0)).slice(0, 3);
                }
                const feat = extractFeatures(historyData.slice(0, 10), 10);
                if (!feat) return ALL_SHAPES.slice(0, 3);
                const probs = mlpModel.forward(feat);
                return [0, 1, 2, 3].sort((a, b) => probs[b] - probs[a]).slice(0, 3).map(i => ALL_SHAPES[i]);
            }

            function getKillFromJingTian(three) {
                return ALL_SHAPES.find(s => !three.includes(s)) || '--';
            }

            // ==================== 引擎二：三层筛选 → 三门池 ====================
            const SIZE_COMBO = {
                '小单': ['小单', '小双', '大双'],
                '小双': ['小双', '小单', '大单'],
                '大单': ['大单', '大双', '小双'],
                '大双': ['大双', '大单', '小单']
            };
            const SD_COMBO = {
                '小单': ['小单', '大单', '大双'],
                '小双': ['小双', '大双', '大单'],
                '大单': ['大单', '小单', '小双'],
                '大双': ['大双', '小双', '小单']
            };
            const SIZE_SD_COMBO = {
                '小单': ['小单', '小双', '大单'],
                '小双': ['小双', '大双', '大单'],
                '大单': ['大单', '大双', '小单'],
                '大双': ['大双', '大单', '小双']
            };
            const TABLES = [
                { name: '大小', fn: (bt) => SIZE_COMBO[bt] || [bt] },
                { name: '单双', fn: (bt) => SD_COMBO[bt] || [bt] },
                { name: '大小单双', fn: (bt) => SIZE_SD_COMBO[bt] || [bt] }
            ];

            function calcBaseType(history3) {
                if (!history3 || history3.length < 3) return '--';
                const totalSum = history3[0].sum + history3[1].sum + history3[2].sum;
                const result = (totalSum / 27) / Math.E;
                const decimalStr = result.toString().split('.')[1] || '';
                const firstThree = decimalStr.slice(0, 3).padEnd(3, '0');
                const baseSum = parseInt(firstThree[0]) + parseInt(firstThree[1]) + parseInt(firstThree[2]);
                return getTypeFromSum(baseSum);
            }

            function calcTableAccuracy(tableFn, history, testCount) {
                if (history.length < 4) return 0;
                let correct = 0,
                    total = 0;
                const max = Math.min(testCount, history.length - 3);
                for (let i = 0; i < max; i++) {
                    const cur = history[i];
                    const hist3 = [history[i + 1], history[i + 2], history[i + 3]];
                    const baseType = calcBaseType(hist3);
                    if (baseType === '--') continue;
                    const pred = tableFn(baseType);
                    if (pred && pred.includes(cur.type)) correct++;
                    total++;
                }
                return total > 0 ? (correct / total) * 100 : 0;
            }

            function selectBestTable(historyData) {
                if (historyData.length < 4) return TABLES[1].fn;
                let candidates = TABLES.map(t => ({ table: t, acc50: calcTableAccuracy(t.fn, historyData, 50) }));
                candidates.sort((a, b) => b.acc50 - a.acc50);
                candidates = candidates.slice(0, 2);
                candidates = candidates.map(item => ({ ...item, acc27: calcTableAccuracy(item.table.fn, historyData,
                        27) }));
                candidates.sort((a, b) => b.acc27 - a.acc27);
                candidates = candidates.slice(0, 1);
                candidates = candidates.map(item => ({ ...item, acc10: calcTableAccuracy(item.table.fn, historyData,
                        10) }));
                candidates.sort((a, b) => b.acc10 - a.acc10);
                return candidates[0].table.fn;
            }

            function getThreeDoor(history) {
                if (history.length < 3) return ['--', '--', '--'];
                const bestFn = selectBestTable(history);
                const baseType = calcBaseType([history[0], history[1], history[2]]);
                if (baseType === '--') return ['--', '--', '--'];
                return bestFn(baseType) || ['--', '--', '--'];
            }

            // ========== 特码 ==========
            function generateSpecials(finalBet) {
                if (!finalBet || finalBet.length === 0) return [];
                let selected = new Set();
                for (let rec of finalBet) {
                    for (let nums of Object.values(MOON_EYE_GROUPS)) {
                        for (let num of nums)
                            if (getTypeFromSum(num) === rec) selected.add(num);
                    }
                }
                let specials = Array.from(selected).sort((a, b) => a - b);
                const maxCount = finalBet.length === 2 ? 4 : 6;
                specials = specials.slice(0, maxCount);
                while (specials.length < maxCount) {
                    let all = Object.values(MOON_EYE_GROUPS).flat();
                    for (let n of all)
                        if (!specials.includes(n)) { specials.push(n); if (specials.length >= maxCount) break; }
                }
                return specials.map(n => String(n).padStart(2, '0'));
            }

            function generateRecordText(kill, finalBet, format, expect) {
                const cleanKill = kill;
                const finalStr = finalBet.join('');
                switch (format) {
                    case '1':
                        return `杀${cleanKill}/${finalStr}/13/14`;
                    case '2':
                        return finalBet.length === 2 ? `${finalBet.join('/')}13/14` : `${finalStr}13/14`;
                    case '3':
                        return `${expect || '----'}/杀${cleanKill}🉐${finalStr}13/14`;
                    default:
                        return `杀${cleanKill}🉐${finalStr} 13/14`;
                }
            }

            function loadRecords() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; } }

            function saveRecords(records) { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

            function verifyOpenedRecord(latestDraw) {
                let records = loadRecords();
                const idx = records.findIndex(r => r.expect === latestDraw.expect && r.status === 'pending');
                if (idx === -1) return;
                const rec = records[idx];
                const is13or14 = (latestDraw.sum === 13 || latestDraw.sum === 14);
                records[idx] = {
                    ...rec,
                    status: 'verified',
                    nums: latestDraw.nums,
                    sum: latestDraw.sum,
                    type: latestDraw.type,
                    killCorrect: is13or14 ? true : (rec.kill !== latestDraw.type),
                    poolCorrect: is13or14 ? true : rec.finalBet.includes(latestDraw.type)
                };
                saveRecords(records);
            }

            function addNextPeriodRecord(nextExpect, kill, finalBet) {
                let records = loadRecords();
                if (records.some(r => r.expect === nextExpect)) return;
                records.push({ expect: nextExpect, status: 'pending', kill, finalBet });
                if (records.length > 50) records.shift();
                saveRecords(records);
            }

            function renderHistory() {
                const tbody = $('historyBody');
                const records = loadRecords().reverse();
                if (!records.length) { tbody.innerHTML = '<tr><td colspan="7">暂无记录</td></tr>'; return; }
                tbody.innerHTML = records.slice(0, 30).map(r => {
                    const kc = r.status === 'pending' ? '⏳' : (r.killCorrect ? '✓' : '✗');
                    const pc = r.status === 'pending' ? '⏳' : (r.poolCorrect ? '✓' : '✗');
                    const finalCount = r.finalBet?.length || 0;
                    return `<tr><td>${r.expect}</td><td>${r.status === 'verified' ? r.nums.join('+') + '=' + r.sum :
                        '待开奖'}</td><td>${r.kill}</td><td>${(r.finalBet || []).join(' ')}</td><td>${finalCount === 2 ?
                        '双组' : '三组'}</td><td class="${r.killCorrect ? 'badge-green' : 'badge-red'}">${kc}</td><td class="${r
                        .poolCorrect ? 'badge-green' : 'badge-red'}">${pc}</td></tr>`;
                }).join('');
            }

            function showCopySuccess() {
                const btn = $('copyBtn');
                btn.classList.add('success');
                btn.innerHTML = '✅';
                setTimeout(() => { btn.classList.remove('success');
                    btn.innerHTML = '📋'; }, 1500);
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try { document.execCommand('copy');
                    showCopySuccess(); } catch (e) { alert('复制失败'); }
                document.body.removeChild(textarea);
            }

            function initCopyEvent() {
                $('copyBtn').addEventListener('click', () => {
                    const val = $('recordText').value.trim();
                    if (!val || val === '等待数据加载...') return;
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(val).then(showCopySuccess).catch(() => fallbackCopy(val));
                    } else fallbackCopy(val);
                });
            }

            let history = [],
                latestDrawTime = null,
                isRequesting = false,
                countdownTimer = null;

            function updateUI() {
                if (!history.length) return;
                const latest = history[0];
                latestDrawTime = latest.opentime ? new Date(latest.opentime) : null;
                verifyOpenedRecord(latest);

                const jtThree = getJingTianThree(history);
                const kill = getKillFromJingTian(jtThree);
                const threeDoor = getThreeDoor(history);
                const finalBet = threeDoor.includes(kill) ? threeDoor.filter(t => t !== kill) : threeDoor;
                const nextExpect = String(parseInt(latest.expect) + 1);
                addNextPeriodRecord(nextExpect, kill, finalBet);

                $('ball1').textContent = latest.nums[0];
                $('ball2').textContent = latest.nums[1];
                $('ball3').textContent = latest.nums[2];
                $('latestPeriod').textContent = latest.expect + '期';
                $('latestSum').textContent = '和值 ' + latest.sum + ' / ' + latest.type;
                $('killText').textContent = kill;
                $('poolText').textContent = threeDoor.join(' · ');
                $('betText').textContent = finalBet.join(' · ');
                const format = $('formatSelect').value;
                $('recordText').value = generateRecordText(kill, finalBet, format, nextExpect);
                $('specialCodesContainer').innerHTML = generateSpecials(finalBet).map(c =>
                    `<span style="background:#fff;padding:8px 14px;border-radius:16px;font-weight:700;">${c}</span>`).join('');
                renderHistory();
                startCountdown();
            }

            function startCountdown() {
                if (countdownTimer) clearInterval(countdownTimer);
                if (!latestDrawTime) { $('countdownText').textContent = '--:--'; return; }
                const tick = () => {
                    const diff = Math.max(0, Math.floor((latestDrawTime.getTime() + DRAW_PERIOD * 1000 - Date.now()) /
                        1000));
                    $('countdownText').textContent = String(Math.floor(diff / 60)).padStart(2, '0') + ':' + String(diff % 60)
                        .padStart(2, '0');
                    const circle = $('countdownCircle');
                    if (circle) circle.style.strokeDashoffset = 213.6 * (1 - diff / DRAW_PERIOD);
                    if (diff <= 0) { clearInterval(countdownTimer);
                        fetchData(); }
                };
                tick();
                countdownTimer = setInterval(tick, 200);
            }

            function robustParseNums(opencode) {
                if (!opencode) return [0, 0, 0];
                const parts = opencode.split(/[,+\s]+/);
                let nums = parts.map(n => parseInt(n)).filter(n => !isNaN(n));
                while (nums.length < 3) nums.push(0);
                return nums.slice(0, 3);
            }

            function robustParseOpentime(opentime) {
                const ts = Number(opentime);
                if (!ts || isNaN(ts)) return Date.now();
                return ts < 1e12 ? ts * 1000 : ts;
            }

            async function fetchData() {
                if (isRequesting) return;
                isRequesting = true;
                const btn = $('refreshBtn'); if (btn) btn.classList.add('loading');
                try {
                    let data = null;
                    try { const resp = await fetch(API_URL, { signal: AbortSignal.timeout(4000) }); if (resp.ok) data =
                            await resp.json(); } catch (e) {}
                    if (!data) { for (const proxy of CORS_PROXIES) { try { const resp = await fetch(proxy.url +
                                encodeURIComponent(API_URL)); if (resp.ok) { data = await resp.json(); break; } } catch (
                            e) { continue; } } }
                    let list = [];
                    if (data && data.data && Array.isArray(data.data)) list = data.data;
                    else if (Array.isArray(data)) list = data;
                    else if (data && typeof data === 'object') list = Object.values(data).filter(item => item && (item
                        .expect || item.qihao || item.nbr));
                    if (list.length) {
                        history = list.map(item => {
                            const nums = robustParseNums(item.opencode);
                            const sum = item.sum ?? nums.reduce((a, b) => a + b, 0);
                            const opentime = robustParseOpentime(item.opentime);
                            return { expect: item.expect || '', nums, sum, type: getTypeFromSum(sum), opentime };
                        }).filter(item => item.sum >= 0 && item.sum <= 27).sort((a, b) => parseInt(b.expect) - parseInt(a
                            .expect));
                        trainMLP(history);
                        updateUI();
                    }
                } catch (e) { console.warn(e); } finally { isRequesting = false; if (btn) btn.classList.remove(
                    'loading'); }
            }

            function initApp() {
                initCopyEvent();
                $('refreshBtn').addEventListener('click', fetchData);
                $('clearHistoryBtn').addEventListener('click', () => { localStorage.removeItem(STORAGE_KEY);
                    renderHistory(); });
                $('formatSelect').addEventListener('change', function() {
                    if (history.length) {
                        const kill = getKillFromJingTian(getJingTianThree(history));
                        const threeDoor = getThreeDoor(history);
                        const finalBet = threeDoor.includes(kill) ? threeDoor.filter(t => t !== kill) : threeDoor;
                        $('recordText').value = generateRecordText(kill, finalBet, this.value, String(parseInt(history[0]
                            .expect) + 1));
                    }
                });
                fetchData();
                setInterval(fetchData, 20000);
            }
        })();
    </script>
