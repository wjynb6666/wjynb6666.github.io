// 按期号升序排序
historyData.sort((a,b)=>a[0]-b[0]);
const lastPeriod = historyData[historyData.length-1][0];
const nextPeriod = lastPeriod + 1;

// 获取最近N期数据用于预测
function getRecentSequence(n=30) {
    return historyData.slice(-n);
}

// 和值区间: 极小<=5, 小6-12, 中13-16, 大17-21, 极大>=22 (但预测避开极大极小)
function getSumType(sum) {
    if(sum<=5) return "极小";
    if(sum<=12) return "小";
    if(sum<=16) return "中";

// ======================= 至尊独家算法（融合马尔可夫链、加权投票、形态回归、振幅收敛） =======================
function predictNext() {
    const seq = getRecentSequence(30); // 取最近30期
    const last = seq[seq.length-1];
    const lastCombo = last[5]; // 组合: 大单/大双/小单/小双
    const lastSum = last[4];
    
    // 1. 马尔可夫链：组合转移概率（基于最近20期统计）
    const comboTrans = { "大单":{"大单":0,"大双":0,"小单":0,"小双":0}, "大双":{"大单":0,"大双":0,"小单":0,"小双":0}, "小单":{"大单":0,"大双":0,"小单":0,"小双":0}, "小双":{"大单":0,"大双":0,"小单":0,"小双":0} };
    for(let i=1;i<seq.length;i++) {
        const prev = seq[i-1][5];
        const curr = seq[i][5];
        if(comboTrans[prev]) comboTrans[prev][curr] = (comboTrans[prev][curr]||0)+1;
    }
    // 归一化得到转移概率
    let markovScores = { "大单":0, "大双":0, "小单":0, "小双":0 };
    for(let from in comboTrans) {
        let total = 0;
        for(let to in comboTrans[from]) total += comboTrans[from][to];
        if(total>0) {
            for(let to in comboTrans[from]) {
                if(from === lastCombo) {
                    markovScores[to] += comboTrans[from][to]/total;
                }
            }
        }
    }
    
    // 2. 加权投票：近15期组合按权重10→1，最新权重高
    const recent15 = seq.slice(-15);
    let weightedScore = { "大单":0, "大双":0, "小单":0, "小双":0 };
    for(let i=0;i<recent15.length;i++) {
        let weight = i+1; // 越新权重越大，这里简单让索引越大权重越大
        let combo = recent15[i][5];
        weightedScore[combo] += weight;
    }
    
    // 3. 形态回归：对子/杂六/顺子影响组合偏好（这里简化为：近期对子频繁后倾向杂六，杂六后倾向大单/大双）
    let recentFeature = seq.slice(-10).map(item=>item[2]||"杂六"); // 特征字段在原数据中未全，用组合辅助
    // 简化：根据最近组合的连贯性，若连续两次相同组合则倾向切换
    let sameCount = 0;
    for(let i=seq.length-1;i>0;i--) {
        if(seq[i][5]===seq[i-1][5]) sameCount++;
        else break;
    }
    let morphScore = { "大单":0, "大双":0, "小单":0, "小双":0 };
    if(sameCount>=1) {
        // 连出后倾向转其他
        if(lastCombo==="大单") morphScore["大双"]+=0.5;
        else if(lastCombo==="大双") morphScore["大单"]+=0.5;
        else if(lastCombo==="小单") morphScore["小双"]+=0.5;
        else morphScore["小单"]+=0.5;
    } else {
        // 顺势延续概率
        morphScore[lastCombo] += 0.3;
    }
    
    // 4. 振幅收敛：和值振幅分析，预测和值范围（取中区13-17为主，避开极大极小）
    let sumAmplitude = [];
    for(let i=1;i<seq.length;i++) {
        sumAmplitude.push(Math.abs(seq[i][4]-seq[i-1][4]));
    }
    let recentAmp = sumAmplitude.slice(-5);
    let avgAmp = recentAmp.reduce((a,b)=>a+b,0)/recentAmp.length;
    // 振幅收敛指向和值稳定在常见区间
    let likelySums = [13,14,15,16,17]; // 基础池
    // 根据最近和值微调
    let lastFewSums = seq.slice(-3).map(s=>s[4]);
    let sumTrend = lastFewSums[2] - lastFewSums[0];
    if(Math.abs(sumTrend)<3 && avgAmp<3) {
        // 振幅收敛，维持中区
        likelySums = [14,15,16,17];
    } else if(sumTrend>0) {
        likelySums = [15,16,17,18];
    } else if(sumTrend<0) {
        likelySums = [12,13,14,15];
    }
    // 过滤极小<=5和极大>=22
    likelySums = likelySums.filter(s=> s>=6 && s<=21);
    if(likelySums.length<4) likelySums = [14,15,16,17];
    let topSums = likelySums.slice(0,4);
    
    // 5. 综合打分：马尔可夫(权重0.4)，加权投票(权重0.4)，形态回归(权重0.2)
    let finalScore = { "大单":0, "大双":0, "小单":0, "小双":0 };
    for(let c in finalScore) {
        finalScore[c] = (markovScores[c]||0)*0.4 + (weightedScore[c]/100)*0.4 + (morphScore[c]||0)*0.2;
    }
    // 排序取前二作为双组
    let sorted = Object.entries(finalScore).sort((a,b)=>b[1]-a[1]);
    let topTwo = sorted.slice(0,2).map(x=>x[0]);
    // 保险：若两个相同或得分过低，则补充默认
    if(topTwo.length<2) topTwo = ["大单","大双"];
    if(topTwo[0]===topTwo[1]) topTwo[1] = topTwo[0]==="大单"?"大双":"大单";
    
    // 6. 特码（四个和值）基于振幅收敛和冷热统计
    // 统计近20期和值频率
    let sumFreq = {};
    seq.slice(-20).forEach(s=>{ let sum=s[4]; sumFreq[sum]=(sumFreq[sum]||0)+1; });
    // 候选和值：排除<=5和>=22，取前四高频 + 振幅收敛推荐
    let candidates = [];
    for(let s=6;s<=21;s++) {
        if(!topSums.includes(s) && sumFreq[s]) candidates.push([s, sumFreq[s]]);
    }
    candidates.sort((a,b)=>b[1]-a[1]);
    let specialSums = [...topSums];
    for(let i=0;i<candidates.length && specialSums.length<4;i++) {
        if(!specialSums.includes(candidates[i][0])) specialSums.push(candidates[i][0]);
    }
    while(specialSums.length<4) specialSums.push(14,15,16,17);
    specialSums = specialSums.slice(0,4);
    
    return { doubleGroup: topTwo.join("、"), specialSums: specialSums.join("、") };
}
